<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile — NBG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:700px">
    <a href="/dashboard" class="btn btn-sm btn-outline-secondary mb-3">← Dashboard</a>
    <h4>My Profile</h4>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Profile update form — role field included (privilege escalation) -->
    <div class="card mb-4">
        <div class="card-body">
            <form method="post" action="/profile/update">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="fullName" class="form-control" th:value="${user?.fullName}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" th:value="${user?.email}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control" th:value="${user?.phone}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address</label>
                        <input type="text" name="address" class="form-control" th:value="${user?.address}">
                    </div>
                    <!-- Role field visible in source — user can modify to ADMIN -->
                    <input type="hidden" name="role" th:value="${user?.role}">
                    <div class="col-12">
                        <button type="submit" class="btn" style="background:#003366;color:#fff">Update Profile</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Send message — stored XSS via body field -->
    <div class="card mb-4">
        <div class="card-header">Send Message to Support</div>
        <div class="card-body">
            <form method="post" action="/profile/message">
                <div class="mb-2">
                    <input type="text" name="subject" class="form-control" placeholder="Subject">
                </div>
                <div class="mb-2">
                    <textarea name="body" class="form-control" rows="4"
                              placeholder="Your message (HTML allowed)"></textarea>
                </div>
                <button type="submit" class="btn btn-sm btn-outline-primary">Send</button>
            </form>
        </div>
    </div>

    <!-- Messages rendered with th:utext — stored XSS execution point -->
    <div class="card">
        <div class="card-header">My Messages</div>
        <div class="card-body">
            <div th:each="msg : ${messages}" class="mb-3 border-bottom pb-2">
                <strong th:utext="${msg.subject}"></strong>
                <div th:utext="${msg.body}"></div>
                <small class="text-muted" th:text="${msg.createdAt}"></small>
            </div>
            <div th:if="${#lists.isEmpty(messages)}" class="text-muted small">No messages.</div>
        </div>
    </div>
</div>
</body>
</html>
