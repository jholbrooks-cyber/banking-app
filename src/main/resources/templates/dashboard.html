<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — NBG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .sidebar { background: #003366; min-height: 100vh; }
        .sidebar a { color: #aac4e8; text-decoration: none; }
        .sidebar a:hover { color: #fff; }
        .balance-card { background: linear-gradient(135deg, #003366, #0066cc); color: #fff; }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar p-3" style="width:220px">
        <div class="text-white fw-bold mb-4 mt-2">NBG Online</div>
        <nav class="nav flex-column gap-2">
            <a href="/dashboard" class="nav-link text-white"><i class="bi bi-house-door me-2"></i>Dashboard</a>
            <a href="/accounts" class="nav-link"><i class="bi bi-credit-card me-2"></i>Accounts</a>
            <a href="/transfer" class="nav-link"><i class="bi bi-arrow-left-right me-2"></i>Transfer</a>
            <a href="/profile" class="nav-link"><i class="bi bi-person me-2"></i>Profile</a>
            <a href="/admin" class="nav-link"><i class="bi bi-shield me-2"></i>Admin</a>
            <hr style="border-color:#ffffff33">
            <a href="/logout" class="nav-link text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </nav>
    </div>

    <!-- Main -->
    <div class="flex-grow-1 p-4">
        <!-- User info pulled from server — full_name rendered with th:utext (no encoding) -->
        <h4 class="mb-4">Welcome back, <span th:utext="${user?.fullName}">User</span></h4>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card balance-card p-3">
                    <small>Total Balance</small>
                    <h3 class="mb-0">€<span th:text="${#numbers.formatDecimal(totalBalance,1,'COMMA',2,'POINT')}">0.00</span></h3>
                    <small>across all accounts</small>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 bg-light">
                    <small class="text-muted">Accounts</small>
                    <h3 th:text="${accounts?.size()}">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 bg-light">
                    <small class="text-muted">Role</small>
                    <h5 th:text="${user?.role}" class="mt-2">USER</h5>
                </div>
            </div>
        </div>

        <h5>Your Accounts</h5>
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Account Number</th>
                    <th>Type</th>
                    <th>Balance</th>
                    <th>IBAN</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="acct : ${accounts}">
                    <!-- Account ID in URL — IDOR if user changes the number -->
                    <td th:text="${acct.accountNumber}"></td>
                    <td th:text="${acct.accountType}"></td>
                    <td>€<span th:text="${#numbers.formatDecimal(acct.balance,1,'COMMA',2,'POINT')}"></span></td>
                    <td><code th:text="${acct.iban}"></code></td>
                    <td><a th:href="@{/accounts/{id}(id=${acct.id})}" class="btn btn-sm btn-outline-primary">View</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
