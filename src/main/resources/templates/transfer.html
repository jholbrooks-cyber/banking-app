<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transfer — NBG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-header" style="background:#003366; color:#fff">
                    <strong>National Bank of Greece — Fund Transfer</strong>
                </div>
                <div class="card-body p-4">

                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <!-- Error displayed with th:utext — XSS if error contains HTML -->
                    <div th:if="${error}" class="alert alert-danger" th:utext="${error}"></div>

                    <!-- No CSRF token in this form -->
                    <form method="post" action="/transfer">
                        <div class="mb-3">
                            <label class="form-label">From Account</label>
                            <select name="fromAccount" class="form-select">
                                <option th:each="a : ${accounts}"
                                        th:value="${a.accountNumber}"
                                        th:text="${a.accountNumber + ' (€' + a.balance + ')'}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">To Account Number</label>
                            <input type="text" name="toAccount" class="form-control" placeholder="e.g. NBG-0000004">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount (€)</label>
                            <input type="number" name="amount" step="0.01" class="form-control" placeholder="0.00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" name="description" class="form-control" placeholder="Payment description">
                        </div>

                        <!-- Hidden fields the server should set — left in the form for mass assignment demo -->
                        <input type="hidden" name="status" value="COMPLETED">
                        <input type="hidden" name="transactionType" value="TRANSFER">
                        <input type="hidden" name="adminOverride" value="false">

                        <div class="d-grid">
                            <button type="submit" class="btn" style="background:#003366;color:#fff">Confirm Transfer</button>
                        </div>
                    </form>

                    <div class="mt-3 small text-muted">
                        <a href="/dashboard">← Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
