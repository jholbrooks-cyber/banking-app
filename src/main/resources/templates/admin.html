<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel — NBG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Admin Panel <span class="badge bg-danger">Unrestricted</span></h4>
        <a href="/dashboard" class="btn btn-sm btn-outline-secondary">← Dashboard</a>
    </div>

    <!-- Search — q reflected without encoding (XSS) -->
    <form method="get" action="/admin/search" class="mb-4">
        <div class="input-group" style="max-width:400px">
            <input type="text" name="q" class="form-control" placeholder="Search users..."
                   th:value="${query}">
            <button type="submit" class="btn btn-dark">Search</button>
        </div>
    </form>

    <div th:if="${query}" class="alert alert-info">
        <!-- th:utext — search query rendered as raw HTML -->
        Results for: <span th:utext="${query}"></span>
    </div>

    <!-- User table — exposes hashed passwords, emails, phones -->
    <h5>Users</h5>
    <table class="table table-sm table-bordered bg-white">
        <thead class="table-dark">
            <tr>
                <th>ID</th><th>Username</th><th>Password Hash</th>
                <th>Email</th><th>Role</th><th>Phone</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}"></td>
                <!-- MD5 hash exposed — crackable offline -->
                <td><code th:text="${u.password}"></code></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.role}"></td>
                <td th:text="${u.phone}"></td>
                <td>
                    <a th:href="@{/admin/promote/{id}(id=${u.id})}" class="btn btn-xs btn-warning btn-sm">Promote</a>
                    <a th:href="@{/admin/delete/{id}(id=${u.id})}" class="btn btn-xs btn-danger btn-sm"
                       onclick="return confirm('Delete?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Accounts — balances of all users exposed -->
    <h5 class="mt-4">All Accounts</h5>
    <table class="table table-sm table-bordered bg-white">
        <thead class="table-dark">
            <tr><th>ID</th><th>Account No.</th><th>User ID</th><th>Balance</th><th>IBAN</th></tr>
        </thead>
        <tbody>
            <tr th:each="a : ${accounts}">
                <td th:text="${a.id}"></td>
                <td th:text="${a.accountNumber}"></td>
                <td th:text="${a.userId}"></td>
                <td>€<span th:text="${a.balance}"></span></td>
                <td th:text="${a.iban}"></td>
            </tr>
        </tbody>
    </table>

    <div class="text-muted small mt-4">
        H2 Console: <a href="/h2-console" target="_blank">/h2-console</a> |
        Actuator: <a href="/actuator" target="_blank">/actuator</a> |
        Env: <a href="/actuator/env" target="_blank">/actuator/env</a>
    </div>
</div>
</body>
</html>
