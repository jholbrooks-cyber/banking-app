<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error — NBG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card shadow" style="width:600px">
    <div class="card-header text-white bg-danger">Application Error</div>
    <div class="card-body p-4">
        <!-- Full stack trace exposed — information disclosure -->
        <p><strong>Status:</strong> <span th:text="${status}"></span></p>
        <p><strong>Error:</strong> <span th:text="${error}"></span></p>
        <p><strong>Path:</strong> <span th:text="${path}"></span></p>

        <!-- Exception message rendered unescaped — potential XSS if exception msg contains user input -->
        <div th:if="${message}" class="alert alert-warning">
            <strong>Message:</strong> <span th:utext="${message}"></span>
        </div>

        <!-- Full exception trace rendered to the browser -->
        <div th:if="${trace}" class="mt-3">
            <details open>
                <summary><strong>Stack Trace</strong> (server.error.include-stacktrace=always)</summary>
                <pre class="mt-2 p-2 bg-dark text-white small" style="overflow-x:auto; max-height:400px"
                     th:text="${trace}"></pre>
            </details>
        </div>

        <div class="mt-3">
            <a href="/dashboard" class="btn btn-sm btn-outline-secondary">Dashboard</a>
            <a href="/login" class="btn btn-sm btn-outline-primary">Login</a>
        </div>
    </div>
</div>
</body>
</html>
