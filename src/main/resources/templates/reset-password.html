<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password — NBG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card shadow" style="width:420px">
    <div class="card-header text-white" style="background:#003366">Reset Password</div>
    <div class="card-body p-4">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:utext="${error}"></div>

        <!-- No rate limiting, no email token — just secret answer -->
        <form method="post" action="/reset-password">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Security Answer</label>
                <input type="text" name="answer" class="form-control" placeholder="Your mother's maiden name">
            </div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="newPassword" class="form-control">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn" style="background:#003366;color:#fff">Reset Password</button>
            </div>
        </form>
        <div class="text-center mt-3 small"><a href="/login">Back to login</a></div>
    </div>
</div>
</body>
</html>
