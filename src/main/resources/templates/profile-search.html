<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Search — NBG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <a href="/profile" class="btn btn-sm btn-outline-secondary mb-3">← Profile</a>
    <h5>Search Users</h5>

    <!-- Reflected XSS: query rendered raw into page -->
    <div th:if="${query}" class="alert alert-secondary">
        Search results for: <span th:utext="${query}"></span>
    </div>

    <form method="get" action="/profile/search" class="mb-4">
        <div class="input-group" style="max-width:400px">
            <input type="text" name="q" class="form-control" placeholder="Search by name..."
                   th:value="${query}">
            <button type="submit" class="btn btn-dark">Search</button>
        </div>
    </form>

    <!-- Results expose all user fields — no access control -->
    <table class="table table-hover bg-white" th:if="${results != null and !#lists.isEmpty(results)}">
        <thead class="table-dark">
            <tr><th>ID</th><th>Username</th><th>Full Name</th><th>Email</th><th>Phone</th><th>Role</th></tr>
        </thead>
        <tbody>
            <tr th:each="u : ${results}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.fullName}"></td>
                <!-- PII exposed to all authenticated users -->
                <td th:text="${u.email}"></td>
                <td th:text="${u.phone}"></td>
                <td><span class="badge bg-secondary" th:text="${u.role}"></span></td>
            </tr>
        </tbody>
    </table>

    <div th:if="${results != null and #lists.isEmpty(results)}" class="text-muted">
        No users found for "<span th:utext="${query}"></span>".
    </div>
</div>
</body>
</html>
