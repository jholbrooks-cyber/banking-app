spring.application.name=national-bank-of-greece

# H2 Console exposed to all (misconfiguration)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.datasource.url=jdbc:h2:mem:nbgdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.sql.init.mode=always

# Verbose errors exposed to client (bad practice)
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator endpoints all exposed (misconfiguration)
management.endpoints.web.exposure.include=*
management.endpoint.env.enabled=true
management.endpoint.health.show-details=always

# Hardcoded JWT secret (weak, in config file)
app.jwt.secret=NBGSecretKey2024
app.jwt.expiration=86400000

# Logging level exposing sensitive info
logging.level.com.nationalbankgreece=DEBUG
logging.level.org.springframework.web=DEBUG
